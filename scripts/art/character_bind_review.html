<!doctype html><meta charset=utf-8><style>*{margin:0;box-sizing:border-box}body{background:#eee8dd}#p{width:780px;height:920px}canvas{display:block}nav{position:absolute;top:10px;left:10px;display:flex;gap:15px}button{padding:14px;font-size:20px}</style><div id=p></div><nav><button onclick="pose('guard')">待機</button><button onclick="pose('punch')">直拳</button></nav><script src=runtime.js></script><script>
const tag=new URLSearchParams(location.search).get('tag')||'after';window.ready=new Promise(async(resolve,reject)=>{const j=await(await fetch(tag+'/character.json')).text(),a=await(await fetch(tag+'/character.atlas')).text(),blob=await(await fetch(tag+'/atlas.png')).blob(),uri=await new Promise(r=>{const f=new FileReader;f.onload=()=>r(f.result);f.readAsDataURL(blob)});window.player=new spine.SpinePlayer('p',{jsonUrl:'character.json',atlasUrl:'character.atlas',rawDataURIs:{'character.json':'data:application/json;base64,'+btoa(j),'character.atlas':'data:text/plain;base64,'+btoa(a),'atlas.png':uri},animation:'guard',showControls:false,showLoading:false,alpha:true,backgroundColor:'00000000',preserveDrawingBuffer:true,premultipliedAlpha:false,viewport:{x:-700,y:-70,width:1400,height:1651.282,padLeft:0,padRight:0,padTop:0,padBottom:0,transitionTime:0},success(p){setTimeout(()=>{p.pause();p.stopRendering();pose('guard');resolve(true)},50)},error(p,e){reject(Error(e))}})});
window.pose=name=>{const p=player,s=p.skeleton;s.x=s.y=0;s.setToSetupPose();s.data.findAnimation(name).apply(s,0,0,false,[],1,spine.MixBlend.setup,spine.MixDirection.mixIn);s.updateWorldTransform(spine.Physics.update);p.drawFrame(false);return p.canvas.toDataURL().split(',')[1]};
</script>

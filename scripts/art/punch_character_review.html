<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>單角色短拳評閱</title>
<style>*{margin:0;box-sizing:border-box}body{background:#f0e9db;color:#28251f;font-family:serif}#stage{position:relative;width:min(100vw,780px);aspect-ratio:780/920}#p,#debug{position:absolute;inset:0}#debug{pointer-events:none;width:100%;height:100%}canvas{display:block}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px}button{min-height:44px;min-width:44px;font:18px serif;padding:10px 16px}#caption{padding:0 14px 14px}</style>
<div id="stage"><div id="p"></div><canvas id="debug" width="780" height="920"></canvas></div>
<nav><button id="play">播放</button><button id="restart">重播</button><button id="step">逐格</button><button id="slow">慢速</button><button id="bones">骨架</button></nav><p id="caption"></p>
<script src="runtime.js"></script><script>
const embedded=/*PUNCH_DATA*/null;
let player,readyFlag=false,t=0,playing=false,slow=false,debug=false,last=null,acc=0,steps=0;
const duration=1.6,step=1/60,reduced=matchMedia('(prefers-reduced-motion: reduce)');
const sourceFrame=new URLSearchParams(location.search).get('source')==='1',frameW=sourceFrame?1024:780,frameH=sourceFrame?1536:920;const viewport={x:sourceFrame?-512:-700,y:sourceFrame?-16:-70,width:sourceFrame?1024:1400,height:sourceFrame?1536:1651.282,padLeft:0,padRight:0,padTop:0,padBottom:0,transitionTime:0};if(sourceFrame){const stage=document.getElementById('stage');stage.style.width='1024px';stage.style.height='1536px'}const dc=document.getElementById('debug');dc.width=frameW;dc.height=frameH;
function caption(){document.getElementById('caption').textContent=`${t.toFixed(2)} / 1.60 秒 · ${playing?'播放中':'已暫停'} · ${slow?'四分之一速度':'正常速度'}`;document.getElementById('play').textContent=playing?'暫停':'播放'}
function drawDebug(){const c=document.getElementById('debug').getContext('2d');c.clearRect(0,0,frameW,frameH);if(!debug)return;const point=b=>[(b.worldX-viewport.x)/viewport.width*frameW,frameH-(b.worldY-viewport.y)/viewport.height*frameH];c.strokeStyle=c.fillStyle='#a43b32';c.lineWidth=2;for(const b of player.skeleton.bones){if(b.data.name==='root')continue;const p=point(b);if(b.parent&&b.parent.data.name!=='root'){const q=point(b.parent);c.beginPath();c.moveTo(...q);c.lineTo(...p);c.stroke()}c.beginPath();c.arc(...p,3,0,Math.PI*2);c.fill()}}
function renderAt(time){const s=player.skeleton;s.setToSetupPose();s.data.findAnimation('punch').apply(s,0,time,false,[],1,spine.MixBlend.setup,spine.MixDirection.mixIn);s.updateWorldTransform(spine.Physics.update);player.drawFrame(false);drawDebug()}
function inspect(time){playing=false;t=Math.max(0,Math.min(duration,time));acc=0;last=null;renderAt(t);caption();return player.canvas.toDataURL().split(',')[1]}
function loop(now){if(!readyFlag)return;requestAnimationFrame(loop);if(last===null){last=now;return}const dt=(now-last)/1000;last=now;if(!playing||document.hidden||dt>.25){acc=0;return}acc+=Math.min(dt,.067)*(slow?.25:1);let n=0;while(acc>=step&&n<4){t=Math.min(duration,t+step);acc-=step;n++;steps++;if(t>=duration){playing=false;acc=0;break}}if(n===4)acc=0;if(n){renderAt(t);caption()}}
window.ready=new Promise(async(resolve,reject)=>{try{const j=embedded?embedded.json:await(await fetch('character.json')).text(),a=embedded?embedded.atlas:await(await fetch('character.atlas')).text();let uri=embedded?.image;if(!uri){const blob=await(await fetch('atlas.png')).blob();uri=await new Promise(r=>{const f=new FileReader;f.onload=()=>r(f.result);f.readAsDataURL(blob)})}player=new spine.SpinePlayer('p',{jsonUrl:'character.json',atlasUrl:'character.atlas',rawDataURIs:{'character.json':'data:application/json;base64,'+btoa(j),'character.atlas':'data:text/plain;base64,'+btoa(a),'atlas.png':uri},animation:'punch',showControls:false,showLoading:false,interactive:false,alpha:true,backgroundColor:'00000000',preserveDrawingBuffer:true,premultipliedAlpha:false,viewport,success(p){player=p;setTimeout(()=>{p.pause();p.stopRendering();p.animationState.clearTracks();readyFlag=true;inspect(0);requestAnimationFrame(loop);resolve(true)},50)},error(p,e){reject(Error(e))}})}catch(e){reject(e)}});
document.getElementById('play').onclick=()=>{if(!readyFlag)return;if(t>=duration)t=0;playing=!playing;acc=0;last=null;caption()};document.getElementById('restart').onclick=()=>{inspect(0);if(!reduced.matches)playing=true;caption()};document.getElementById('step').onclick=()=>inspect(t+step);document.getElementById('slow').onclick=()=>{slow=!slow;caption()};document.getElementById('bones').onclick=()=>{debug=!debug;drawDebug()};document.addEventListener('visibilitychange',()=>{last=null;acc=0});
window.__punchReview={inspect,get player(){return player},get playing(){return playing},get time(){return t},get steps(){return steps},get reduced(){return reduced.matches}};
</script></html>

workflows:
  ios-testflight:
    name: 江湖一生 iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # 喺Codemagic建立同名App Store Connect整合，唔好將p8放入repo。
      app_store_connect: jianghu-life2-app-store
    environment:
      node: 24
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wyc3809.jianghulife2
      groups:
        - jianghu-public-config
      vars:
        IOS_BUNDLE_ID: com.wyc3809.jianghulife2
        IOS_MARKETING_VERSION: '1.0'
        VITE_ONLINE_PUBLIC: '1'
        # 玩家提供的App Store Connect數字App ID，從此App的最新TestFlight build加一。
        APP_STORE_APP_ID: '6826541114'
    scripts:
      - name: 核對TestFlight準備狀態
        script: |
          set -euo pipefail
          node scripts/ios/release-check.mjs
          bash scripts/ios/check-xcode.sh
      - name: 安裝及驗證
        script: |
          set -euo pipefail
          npm ci
          npm test
          npm run audit:narrate
          npm run audit:copy
      - name: 打包遊戲與原生工程
        script: |
          set -euo pipefail
          if [ -n "$APP_STORE_APP_ID" ]; then
            latest="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID")"
            export IOS_BUILD_NUMBER="$((latest + 1))"
          else
            export IOS_BUILD_NUMBER="$((BUILD_NUMBER + 1))"
          fi
          npm run ios:sync
          npm run ios:verify
      - name: 套用Apple簽名
        script: xcode-project use-profiles
      - name: 編譯已簽名IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

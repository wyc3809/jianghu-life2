<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>人物動畫・Spine審閱</title>
<style>
@font-face{font-family:Brush;src:url('asset:brush-font') format('woff2');font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6efe0;color:#282922;font-family:'Noto Sans CJK TC','Microsoft JhengHei',sans-serif}main{position:relative;height:100dvh;max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column;gap:7px;background:#f6efe0 url('asset:paper') center/384px}header{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none}h1{font:700 29px Brush,serif;margin:0;padding-bottom:6px;background:url('asset:underline') center bottom/100% 4px no-repeat}header small{color:#877961;font-size:12px}button{font:inherit;min-height:44px;min-width:44px;touch-action:manipulation;color:inherit;background:#faf5e9;border:5px solid transparent;border-image:url('asset:frame') 48 / 5px / 0 stretch;padding:4px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{border-image-source:url('asset:selected');background:#f1e2cb;color:#a3372d}#back{border:0;background:none;font-size:16px}#caption{display:flex;justify-content:space-between;color:#7e705b;font-size:12px;min-height:19px;gap:8px}#stage{position:relative;flex:1;min-height:120px}#player{position:absolute;inset:0}#player .spine-player{position:relative;width:100%;height:100%}#player canvas{display:block;width:100%;height:100%}.spine-player-controls,.spine-player-loading,.spine-player-error{display:none}#fallback{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#notice{position:absolute;inset:0;display:grid;place-content:center;padding:20px;text-align:center;pointer-events:none;color:#8c3c2b}#actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:none}#actions button{font:700 23px Brush,serif;min-height:50px}#transport{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;flex:none}#transport button{font-size:14px;padding:3px 0}#note{margin:0;min-height:32px;font-size:11px;line-height:1.45;color:#7e705b;flex:none}#stage[data-debug=true]{outline:1px solid #b78c58}button:focus-visible{outline:2px solid #a3372d;outline-offset:2px}
</style></head><body><main>
<header><button id="back" type="button">‹ 返回</button><h1>人物動畫</h1><small>Spine 內測</small></header>
<div id="caption"><span>束髮劍客・俠客勁裝</span><span id="status" role="status">載入中</span></div>
<div id="stage"><div id="player"></div><img id="fallback" src="asset:master" alt="人物母版；動畫未啟動"><div id="notice" role="alert">正在載入人物</div></div>
<div id="actions"><button data-action="idle" aria-pressed="true" disabled>待機</button><button data-action="attack" aria-pressed="false" disabled>出拳</button><button data-action="hurt" aria-pressed="false" disabled>受擊</button></div>
<div id="transport"><button id="pause" disabled>暫停</button><button id="step" aria-label="前進一幀" disabled>逐幀</button><button id="speed" disabled>1×</button><button id="mirror" aria-pressed="false" disabled>轉向</button><button id="debug" aria-pressed="false" disabled>骨架</button></div>
<p id="note">先檢查頭頸、肩肘及手腕。此頁只播放動作，不會進行戰鬥或更改裝備。</p>
</main>
<script type="text/plain" id="runtime-license">/*RUNTIME_LICENSE*/</script>
<script type="text/plain" id="font-license">/*FONT_LICENSE*/</script>
<script>/*SPINE_RUNTIME*/</script>
<script>
'use strict';
const rawData=/*SPINE_DATA*/;
const $=id=>document.getElementById(id),labels={idle:'待機',attack:'出拳',hurt:'受擊'};
let player,ready=false,selected='idle',paused=false,mirrored=false,debug=false,speed=1,steps=0,acc=0,last=null,failures=[];
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const metrics={maxGapMs:0,frameCount:0,invalidFrames:0};
function validate(){const bad=player.skeleton.bones.some(b=>![b.worldX,b.worldY,b.a,b.b,b.c,b.d].every(Number.isFinite));if(bad){metrics.invalidFrames++;paused=true;failures.push('骨架出現無效數值');$('notice').textContent='動作已停止，請重新載入';}return !bad;}
function advance(dt){player.animationState.update(dt);player.animationState.apply(player.skeleton);player.skeleton.update(dt);player.skeleton.updateWorldTransform(spine.Physics.update);steps++;validate();}
function caption(){if(!ready)return;const e=player.animationState.getCurrent(0),name=e?.animation.name||selected,text=labels[name]+(paused?'・已暫停':'')+(motion.matches?'・減少動態':'');if($('status').textContent!==text)$('status').textContent=text;const label=paused?'播放':'暫停';if($('pause').textContent!==label)$('pause').textContent=label;for(const b of document.querySelectorAll('[data-action]')){const value=String(b.dataset.action===name);if(b.getAttribute('aria-pressed')!==value)b.setAttribute('aria-pressed',value)}}
function act(name){if(!ready)return;player.skeleton.setToSetupPose();player.animationState.clearTracks();player.animationState.setAnimation(0,name,name==='idle');if(name!=='idle'&&!motion.matches)player.animationState.addAnimation(0,'idle',true,0);selected=name;acc=0;last=null;player.animationState.apply(player.skeleton);player.skeleton.updateWorldTransform(spine.Physics.update);if(motion.matches){paused=true;for(let i=0;i<Math.round((name==='attack'?.35:name==='hurt'?.19:0)*60);i++)advance(1/60);}caption();}
function fail(reason){ready=false;failures.push(String(reason));$('fallback').style.display='block';$('notice').textContent='未能啟動動畫，目前顯示人物母版。';for(const b of document.querySelectorAll('#actions button,#transport button'))b.disabled=true;$('status').textContent='動畫未啟動';}
function start(){try{player=new spine.SpinePlayer('player',{skeleton:'character.json',atlas:'character.atlas',rawDataURIs:rawData,animation:'idle',showControls:false,showLoading:false,interactive:false,premultipliedAlpha:false,alpha:true,backgroundColor:'#00000000',preserveDrawingBuffer:false,defaultMix:.12,viewport:{x:-600,y:-30,width:1200,height:1600,padLeft:0,padRight:0,padTop:0,padBottom:0,transitionTime:0},success(p){player=p;p.pause();ready=true;paused=motion.matches;$('notice').textContent='';for(const b of document.querySelectorAll('#actions button,#transport button'))b.disabled=false;act('idle');window.__spineLab={get player(){return player},get ready(){return ready},get steps(){return steps},get paused(){return paused},get failures(){return failures},get metrics(){return metrics},act,advance,inspect(name,time){act(name);paused=true;player.animationState.clearTracks();player.animationState.setAnimation(0,name,false);player.skeleton.setToSetupPose();advance(0);for(let i=0;i<Math.floor(time*60);i++)advance(1/60);caption();},snapshot(){return player.skeleton.bones.map(b=>({name:b.data.name,x:b.worldX,y:b.worldY,a:b.a,b:b.b,c:b.c,d:b.d}));}};},error(p,reason){fail(reason)},frame(p){p.pause();if(!ready)return;const now=performance.now();metrics.frameCount++;if(last===null){last=now;return}const dt=(now-last)/1000;last=now;if(document.hidden||paused){acc=0;return}metrics.maxGapMs=Math.max(metrics.maxGapMs,dt*1000);if(dt>.25){acc=0;return}acc+=Math.min(dt,.067)*speed;let n=0;while(acc>=1/60&&n<4){advance(1/60);acc-=1/60;n++}if(n===4)acc=0;caption();}});}catch(e){fail(e.message)}}
for(const b of document.querySelectorAll('[data-action]'))b.onclick=()=>{paused=motion.matches;act(b.dataset.action)};
$('pause').onclick=()=>{paused=!paused;last=null;acc=0;caption()};$('step').onclick=()=>{paused=true;last=null;acc=0;advance(1/60);caption()};
$('speed').onclick=()=>{speed=speed===1?.5:speed===.5?.25:1;$('speed').textContent=speed+'×';acc=0;last=null};
$('mirror').onclick=()=>{mirrored=!mirrored;player.skeleton.scaleX=mirrored?-1:1;player.skeleton.updateWorldTransform(spine.Physics.update);$('mirror').setAttribute('aria-pressed',String(mirrored))};
$('debug').onclick=()=>{debug=!debug;player.config.debug.bones=debug;player.config.debug.meshes=debug;$('debug').setAttribute('aria-pressed',String(debug));$('stage').dataset.debug=String(debug)};
$('back').onclick=()=>{if(parent!==window)parent.postMessage({type:'spine-lab-back'},'*');else history.back()};
document.addEventListener('visibilitychange',()=>{last=null;acc=0});
motion.addEventListener('change',()=>{paused=motion.matches;last=null;acc=0;caption()});
window.addEventListener('pagehide',()=>{ready=false;player?.dispose()});
window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='spine-lab-dispose'){ready=false;player?.dispose()}});
start();
</script></body></html>
